name: Build and push worker image

# 配布物は ghcr.io/task-jp/geoscope-worker:latest。
# 手動ビルドだとソースとイメージがいつの間にか食い違うので、main への push で自動化する。
# ユーザーは docker run で :latest を指定するため、ここが止まると修正が誰にも届かない。

on:
  push:
    branches: [main]
    # ドキュメントだけの変更でイメージを焼き直さない
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  # 連続 push で同じタグを取り合わないよう、古い方を打ち切る
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ベースイメージが pytorch/cuda で約8.5GB になる。
      # 標準ランナーの空きは14GB程度しかないので、使わないものを先に消す
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest に加えてコミット SHA も打つ。
          # 「本番のワーカーがどのソースで動いているか」を後から特定できるようにするため
          tags: |
            ghcr.io/task-jp/geoscope-worker:latest
            ghcr.io/task-jp/geoscope-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "### Pushed" >> $GITHUB_STEP_SUMMARY
          echo '- `ghcr.io/task-jp/geoscope-worker:latest`' >> $GITHUB_STEP_SUMMARY
          echo '- `ghcr.io/task-jp/geoscope-worker:${{ github.sha }}`' >> $GITHUB_STEP_SUMMARY
